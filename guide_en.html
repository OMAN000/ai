<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional AI Video Creation Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .prompt-box {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            user-select: all;
        }
    </style>
</head>
<body class="bg-white p-4 flex flex-col h-screen">

    <div id="guide-content" class="flex-grow flex flex-col">
        <h1 class="text-xl font-bold mb-3 text-blue-700">Professional AI Video Creation Guide</h1>

        <div class="mb-3 text-sm text-gray-500">
            Step <span id="step-number" class="font-bold text-blue-600">1</span> of <span id="total-steps">6</span>
        </div>

        <h2 id="step-title" class="text-lg font-bold mb-3 text-gray-800">Step Title</h2>

        <video id="step-video" class="mb-3 rounded" width="100%" height="200" controls autoplay loop muted>
            <source src="1.mp4" type="video/mp4">
            Video not available
        </video>

        <div id="step-desc" class="text-gray-700 mb-4 overflow-y-auto flex-grow text-sm leading-relaxed"></div>
    </div>

    <div id="control-panel" class="pt-3 border-t">
        <div class="flex justify-between">
            <button onclick="prevStep()" id="btn-prev" class="text-gray-500 hover:text-gray-700 disabled:opacity-50 text-sm" disabled>Previous</button>
            <button onclick="nextStep()" id="btn-next" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded text-sm shadow">Next Step</button>
        </div>
    </div>

    <div id="summary-page" class="hidden absolute inset-0 bg-white flex flex-col items-center justify-center text-center p-4">
        <h2 class="text-2xl font-bold text-green-600 mb-4">🎉 Congratulations!</h2>
        <p class="text-gray-700 mb-6">You have successfully completed all steps of AI video creation. You can now review the summary or close the guide.</p>
        <div class="flex flex-col space-y-3">
            <a href="AI-Video-Guide-Simple.pdf" download class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-8 rounded shadow flex items-center gap-2">
                <span>⬇️</span> Download Summary (PDF)
            </a>
            <button onclick="window.close()" class="text-gray-500 hover:underline font-bold py-2 px-6 rounded">Close Guide</button>
        </div>
    </div>

    <script>
        function copyPrompt() {
            const promptText = document.querySelector('.prompt-box').innerText;
            navigator.clipboard.writeText(promptText)
                .then(() => alert('Prompt copied successfully!'))
                .catch(err => console.error('Copy failed:', err));
        }

        const steps = [
            { title: "Step 1: Research and Sign Up", desc: `Start by enabling your screen recorder to document your work. Search for these tools: ChatGPT, Midjourney, RunwayML, ElevenLabs. Create accounts so you are ready to start.`, videoUrl: "1.mp4", extraContent: `<div class="bg-red-50 p-3 border-r-4 border-red-400 text-sm mt-3"><strong>Tip:</strong> Use a <strong>dummy account</strong> to avoid generation limits on images and videos.</div>` },
            { title: "Step 2: Writing the Script (ChatGPT)", desc: `Use the following example to create a full video script. You can edit it to make your own.`, videoUrl: "2.mp4", extraContent: `<div class="flex justify-between items-center mt-2"><span class="text-xs font-semibold">Prompt to copy:</span><button onclick="copyPrompt()" class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-0.5 rounded text-xs">Copy</button></div><div class="prompt-box">Write a full short video script consisting of 5 scenes about "a character exploring a calm futuristic city". For each scene, provide: 1. Scene Description 2. Midjourney Prompt for a static image 3. Animation Notes for RunwayML 4. Voiceover Script with the desired tone ⚠️ This is just an example, feel free to write your own script.</div>` },
            { title: "Step 3: Generate Static Images (Midjourney)", desc: `Use each sentence from your script as a prompt to generate images. Try multiple variations and select the best image for each scene. Download the images with numbering.`, videoUrl: "3.mp4", extraContent: `<div class="bg-yellow-50 p-3 border-r-4 border-yellow-400 text-sm mt-3"><strong>Tip:</strong> Adjust prompts to change art style or atmosphere.</div>` },
            { title: "Step 4: Animate Scenes (RunwayML)", desc: `Use the Gen-2 feature (or equivalent) to animate each static image. Set camera movements and effects for each scene. Save each video clip.`, videoUrl: "4.mp4", extraContent: `<div class="bg-red-50 p-3 border-r-4 border-red-400 text-sm mt-3"><strong>Tip:</strong> Use a dummy account if daily animation limits apply.</div>` },
            { title: "Step 5: Create Voiceover (ElevenLabs)", desc: `Generate voiceover for each scene, selecting the appropriate tone (calm, energetic, etc.). Download audio files in order.`, videoUrl: "5.mp4", extraContent: `<div class="bg-blue-50 p-3 border-r-4 border-blue-400 text-sm mt-3"><strong>Note:</strong> Recording is optional for basic use.</div>` },
            { title: "Step 6: Assemble and Export (CapCut)", desc: `Import all video clips and audio files into a new CapCut project. Arrange scenes, add background music, and export the final video in high quality.`, videoUrl: "6.mp4", extraContent: `<div class="bg-green-50 p-3 border-r-4 border-green-400 text-sm mt-3"><strong>Tip:</strong> Ensure precise audio-video synchronization for best quality.</div>` }
        ];

        let currentStepIndex = 0;
        const stepTitle = document.getElementById('step-title');
        const stepDescContainer = document.getElementById('step-desc');
        const stepNum = document.getElementById('step-number');
        const totalSteps = document.getElementById('total-steps');
        const guideContent = document.getElementById('guide-content');
        const controlPanel = document.getElementById('control-panel');
        const summaryPage = document.getElementById('summary-page');
        const btnNext = document.getElementById('btn-next');
        const btnPrev = document.getElementById('btn-prev');
        const stepVideo = document.getElementById('step-video');

        totalSteps.innerText = steps.length;

        function loadStep(index) {
            const step = steps[index];
            stepTitle.innerText = step.title;
            stepDescContainer.innerHTML = `<p>${step.desc}</p>` + (step.extraContent || '');
            stepNum.innerText = index + 1;

            stepVideo.src = step.videoUrl;
            stepVideo.load();
            stepVideo.play();

            btnPrev.disabled = index === 0;
            if(index === steps.length-1){
                btnNext.innerText = "Finish Guide";
                btnNext.classList.replace('bg-blue-600','bg-green-600');
            } else {
                btnNext.innerText = "Next Step";
                btnNext.classList.replace('bg-green-600','bg-blue-600');
            }
        }

        function nextStep(){
            if(currentStepIndex < steps.length-1){ currentStepIndex++; loadStep(currentStepIndex); }
            else{ finishGuide(); }
        }

        function prevStep(){
            if(currentStepIndex>0){ currentStepIndex--; loadStep(currentStepIndex); }
        }

        function finishGuide(){
            guideContent.classList.add('hidden');
            controlPanel.classList.add('hidden');
            summaryPage.classList.remove('hidden');
        }

        loadStep(currentStepIndex);
    </script>

</body>
</html>
